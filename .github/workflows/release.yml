name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package extension
        run: bash package.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/canopy-ruler-*.zip
          generate_release_notes: true
          name: ${{ github.ref_name }}
